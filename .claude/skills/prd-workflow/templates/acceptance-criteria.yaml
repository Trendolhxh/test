#    3. ?

# Advance Check（整轮）：
#  - 所有 metric 至少被一条 AC 覆盖
#  - 所有 DEC 至少被一条 AC 引用
#  - 总数 ≥ 6 条且分布在 ≥ 2 个 theme
#  - 每条 AC 都有 test_hint
