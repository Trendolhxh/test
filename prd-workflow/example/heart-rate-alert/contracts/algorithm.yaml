# 算法边界契约（产品视角）
# ⚠️ 只写用户感知层，技术实现归算法工程师

algorithm_boundary:
  what_it_does_zh: "实时检测心率异常并推送告警"
  input_expectation_zh: "需要手表持续采集的心率 + 加速度数据"
  output_the_user_sees:
    - field_zh: "当前心率"
      unit: "bpm"
      display_rule: "整数，≥100 红色告警、60-99 绿色正常"
    - field_zh: "置信度"
      unit: "高/中/低"
      display_rule: "低置信度时显示'仅供参考'标签"

  uncertain_states:
    low_confidence:
      user_sees_zh: "信号不佳，数据仅供参考"
      related_screen: SCR-02.low_signal
    timeout:
      user_sees_zh: "计算中，请稍候…"
      related_screen: SCR-02.low_signal
    model_unavailable:
      user_sees_zh: "心率检测暂不可用，请稍后重试"
      related_screen: SCR-02.low_signal

  perceived_performance:
    response_feel: "手腕抬起后 1 秒内看到心率"
    battery_feel: "用户无明显感知"
    device_constraint: "Watch v1+ 必须支持"

  related_ac: [AC-01, AC-03, AC-04]

signoff:
  algorithm_boundary:
    owner: 孙七
    signed: true
    signed_at: "2026-05-09T14:00:00Z"
