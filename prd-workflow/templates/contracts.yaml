# Round 4 · Product Contracts · 产品契约
# ⚠️ 这是【产品契约】不是【技术设计】。
# PM 只写用户能感知的东西；技术选型、API schema、错误码 ID 全部归研发。
#
# 拆为最多 3 个文件落到 specs/{slug}/contracts/ 下：
#   data-expectations.yaml | events.yaml | algorithm-boundary.yaml
# hardware 需求写在 data-expectations.yaml 的 hardware_needs 段即可，不单独开文件。
#
# 每个文件由对应 owner 签字，不签不许进入 Round 5。

# ====================================================================
# data-expectations.yaml · 产品对数据的期望（给前后端 + 算法）
# ====================================================================
# ⚠️ 禁止写：API 路径、request/response schema、错误码英文 ID、
#            数据库 schema、缓存 TTL 数字、存储介质

# —— 用户看到的数据 ——
data_the_user_sees:
  - field_zh: ""                           # 中文字段名，例："今日精力分"
    unit: ""                               # 单位，例："分（0-100）"
    source_zh: ""                          # 数据来源的产品描述，例："算法输出"
    display_rule: ""                       # 显示规则，例："整数、无小数"
    related_ac: [AC-01]

# —— 用户看到的错误/异常 ——
user_facing_errors:
  - scenario_zh: ""                        # 什么场景下出现，例："7 天内无佩戴数据"
    user_sees_zh: ""                       # 用户看到什么，例："暂无数据，请佩戴手表后查看"
    recovery_zh: ""                        # 用户怎么恢复，例："佩戴后次日自动恢复"
    related_ac: []
    # ⚠️ 错误码英文 ID 归研发定义，PRD 只管用户看到的文案和场景

# —— 数据新鲜度 / 离线预期 ——
freshness:
  offline_readable: false                  # 离线场景是否要能看到上次数据
  staleness_tolerance: ""                  # 例："24h 内可接受"、"必须实时"、"切回前台即更新"
                                           # ⚠️ 不写 TTL 数字、缓存策略

# —— 刷新时机（用户视角，不写实现机制） ——
refresh_triggers:
  - ""                                     # 例："App 从后台切回前台"、"用户下拉"、"切换日期"
                                           # ⚠️ 不写 observer/polling/WebSocket

# —— 硬件需求（如涉及；PM 只写"需要什么数据"） ——
hardware_needs:
  required_data: []                        # 例：["心率连续采样"、"加速度计"]
  user_perceived_battery: ""               # 例："用户无感"、"日续航不低于 X 天"
  device_constraint: ""                    # 例："Watch v1+ 必须支持"
                                           # ⚠️ 不写协议（BLE/WiFi）、传感器型号、uA/mA 数字

# ====================================================================
# events.yaml · 埋点事件（给前端 + 数据）
# ====================================================================
# 埋点是产品分析职责，PM 定义事件语义和字段。
events:
  - name: ""                               # snake_case，例：energy_detail_viewed
    description_zh: ""                     # 中文：用户做了什么
    trigger_zh: ""                         # 中文：什么时候触发，例："用户进入精力详情页"
    fields:
      - name: ""                           # snake_case
        meaning_zh: ""                     # 中文：这个字段代表什么
        type: string|int|float|bool|enum
        example: ""
    related_ac: [AC-01]
    privacy: low|medium|high               # 高敏感字段需合规审

# ====================================================================
# algorithm-boundary.yaml · 算法边界契约（仅涉及算法时）
# ====================================================================
# PM 只写：算法需要什么输入语义、输出什么用户可见的东西、失败时用户看到什么。
# ⚠️ 禁止写：模型架构、训练参数、内存/CPU、采样率精确值、I/O JSON Schema。
algorithm_boundary:
  what_it_does_zh: ""                      # 一句话：这个算法对用户意味着什么
  input_expectation_zh: ""                 # PM 视角：需要什么数据，例："最近 7 天的睡眠 + 运动 + 心率"
  output_the_user_sees:                    # 用户能看到的算法产出
    - field_zh: ""                         # 例："精力分"
      unit: ""                             # 例："0-100 分"
      display_rule: ""                     # 例："整数，≥80 绿色、60-79 黄色、<60 红色"

  # 算法不确定态 → 用户看到什么（⚠️ 强制：每种态必须有对应 UI）
  uncertain_states:
    low_confidence:
      user_sees_zh: ""                     # 例："数据不足，仅供参考"
      related_screen: ""                   # SCR-XX.state_id
    timeout:
      user_sees_zh: ""
      related_screen: ""
    model_unavailable:
      user_sees_zh: ""
      related_screen: ""

  # 用户感知的性能边界（不写实现层数字）
  perceived_performance:
    response_feel: ""                      # 例："点击后 1 秒内出结果"、"后台静默计算"
    battery_feel: ""                       # 例："用户无明显感知"
    device_constraint: ""                  # 例："必须端侧运行（Watch v1+）"

  related_ac: []

# ====================================================================
# Sign-off
# ====================================================================
signoff:
  data_expectations:
    owner: ""
    signed: false
    signed_at: ""
  events:
    owner: ""
    signed: false
    signed_at: ""
  algorithm_boundary:
    owner: ""                              # 无算法时设 owner: null
    signed: false
    signed_at: ""

# Advance Check：
#  - 每条 AC 至少能对应到一个 contract 字段（data/event/algorithm）
#  - 算法不确定态全部有 UI 状态对应（uncertain_states 三项非空）
#  - user_facing_errors 每条有 user_sees_zh
#  - signoff 中所有非 null owner 已 signed: true
#  - 无实现选型词（lint 会 warn）
